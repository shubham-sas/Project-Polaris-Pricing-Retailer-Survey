<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Pricing Survey - Paper Boat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 12px; line-height: 1.6; }
.container { max-width: 540px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
.header { background: #f8f9fa; padding: 1.25rem; border-bottom: 1px solid #e9ecef; }
.header h1 { font-size: 20px; font-weight: 600; margin-bottom: 3px; color: #212529; }
.header p { font-size: 13px; color: #6c757d; }
.content { padding: 1.25rem; }
.progress-bar { height: 4px; background: #e9ecef; }
.progress-fill { height: 100%; background: #0d6efd; transition: width 0.3s; }

.instruction {
  background: #cfe2ff; color: #084298;
  padding: 12px 16px; border-radius: 8px;
  font-size: 13px; margin-bottom: 1.25rem; line-height: 1.7;
}
.instruction strong { display: block; margin-bottom: 4px; font-size: 14px; }

.category-card { background: #f8f9fa; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid #dee2e6; }
.category-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.category-desc { font-size: 12px; color: #6c757d; margin-bottom: 12px; }

.brand-section { background: white; border-radius: 8px; padding: 12px; margin-bottom: 8px; border: 1px solid #dee2e6; }
.brand-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.brand-name { font-size: 14px; font-weight: 500; }
.toggle-icon { color: #6c757d; font-size: 18px; }
.own-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #cfe2ff; color: #084298; }
.done-badge { font-size: 10px; color: #198754; }

/* SKU slot layout */
.sku-slots { margin-top: 14px; }
.sku-slot { margin-bottom: 12px; border-radius: 8px; overflow: hidden; border: 1px solid #dee2e6; }
.sku-slot-label {
  font-size: 11px; font-weight: 600; padding: 5px 10px;
  display: flex; align-items: center; gap: 6px;
}
.slot-lowest { background: #d1e7dd; color: #0f5132; }
.slot-highest { background: #f8d7da; color: #842029; }
.slot-bestselling { background: #fff3cd; color: #664d03; }
.slot-other { background: #f8f9fa; color: #6c757d; }

.sku-fields { padding: 10px; background: white; display: grid; grid-template-columns: 1.4fr 0.7fr 0.65fr 0.65fr 0.75fr; gap: 6px; align-items: start; }
.sku-fields-header { padding: 4px 10px 0; background: white; display: grid; grid-template-columns: 1.4fr 0.7fr 0.65fr 0.65fr 0.75fr; gap: 6px; font-size: 10px; font-weight: 600; color: #6c757d; }
.sku-dist-row { padding: 8px 10px; background: #f8f9fa; border-top: 1px solid #e9ecef; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; }
.sku-dist-label { font-size: 11px; color: #6c757d; font-weight: 500; }

.input-wrapper { display: flex; flex-direction: column; gap: 2px; }
select, input[type="number"], input[type="text"].price-inp {
  width: 100%; padding: 7px 5px; font-size: 12px;
  border: 1px solid #ced4da; border-radius: 6px;
  background: white; color: #212529;
}
input[type="number"] { font-family: monospace; -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input:focus, select:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.1); }
input[readonly] { background: #f0f0f0 !important; color: #6c757d; }
.error-msg { font-size: 10px; color: #dc3545; }

.add-sku-btn {
  width: 100%; margin-top: 8px; padding: 8px;
  border: 1px dashed #ced4da; border-radius: 6px;
  background: white; font-size: 12px; color: #6c757d;
  cursor: pointer; text-align: center;
}
.add-sku-btn:hover { border-color: #0d6efd; color: #0d6efd; background: #f0f5ff; }

.add-brand-btn {
  width: 100%; margin-top: 4px; padding: 10px;
  border: 1px dashed #adb5bd; border-radius: 8px;
  background: white; font-size: 13px; color: #495057;
  cursor: pointer; text-align: center;
}
.add-brand-btn:hover { border-color: #0d6efd; color: #0d6efd; }

.custom-brand-input { display: flex; gap: 8px; margin-top: 4px; }
.custom-brand-input input { flex: 1; padding: 10px; font-size: 13px; border: 1px solid #0d6efd; border-radius: 8px; }
.custom-brand-input button { padding: 10px 16px; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }

.nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.5rem; }
.btn { padding: 14px 20px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary { background: #0d6efd; color: white; }
.btn-secondary { background: white; border: 1px solid #ced4da; color: #212529; }
.btn:active { transform: scale(0.98); }
.btn-full { grid-column: span 2; }

.completion-screen { text-align: center; padding: 2rem 1rem; }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect } = React;

const PACK_SIZES = [160, 180, 200, 250, 300, 330, 500, 750, 1000, 1500, 2000];
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbywlJW1at5bSMLC9yNyy4Xknq9zbTRy4pATTZOZT4p3vU9-I8DRPOCCUonwSIsMcD6o/exec';

// Each brand has flavors list. SKU slots: lowest, highest, bestselling, then extras.
const CATEGORIES = {
  pb_premium: {
    name: 'Paper Boat Premium Juice (>24%)',
    desc: 'Premium fruit juices',
    brands: [
      { id: 'pb_juice', name: 'Paper Boat', isOwn: true,
        flavors: ['Aam Panna', 'Aamras', 'Jamun', 'Guava', 'Anaar', 'Jaljeera', 'Golgappe ka Pani', 'Raw Mango', 'Thandai'] },
      { id: 'tropicana_100', name: 'Tropicana 100%',
        flavors: ['Orange', 'Mixed Fruit', 'Apple', 'Mango', 'Litchi', 'Pomegranate', 'Guava'] },
      { id: 'real_100', name: 'Real 100%',
        flavors: ['Orange', 'Mango', 'Mixed Fruit', 'Apple', 'Grape', 'Cranberry', 'Pomegranate'] },
      { id: 'raw_pressery', name: 'Raw Pressery',
        flavors: ['Orange', 'Apple', 'Watermelon', 'Mixed Fruit', 'Beetroot', 'Green', 'Carrot'] },
      { id: 'b_natural_premium', name: 'B Natural',
        flavors: ['Orange', 'Mango', 'Mixed Fruit', 'Apple', 'Litchi', 'Guava'] },
    ]
  },
  pb_swing: {
    name: 'PB Swing / Fruit Drinks',
    desc: 'Nectars and fruit drinks (juice <24%)',
    brands: [
      { id: 'pb_swing', name: 'PB Swing', isOwn: true,
        flavors: ['Mango', 'Orange', 'Mixed Fruit', 'Guava', 'Litchi', 'Pineapple'] },
      { id: 'frooti', name: 'Frooti',
        flavors: ['Mango', 'Mango Fizz'] },
      { id: 'maaza', name: 'Maaza',
        flavors: ['Mango', 'Guava', 'Litchi'] },
      { id: 'minute_maid', name: 'Minute Maid',
        flavors: ['Pulpy Orange', 'Nimbu Fresh', 'Mixed Fruit', 'Apple', 'Mango'] },
      { id: 'appy', name: 'Appy',
        flavors: ['Appy Fizz', 'Apple'] },
      { id: 'tropicana_delight', name: 'Tropicana Delight',
        flavors: ['Mango', 'Mixed Fruit', 'Orange', 'Guava'] },
      { id: 'slice', name: 'Slice',
        flavors: ['Mango', 'Jeera Masala'] },
      { id: 'real_delight', name: 'Real Fruit Power',
        flavors: ['Mango', 'Mixed Fruit', 'Orange', 'Apple'] },
    ]
  },
  coconut: {
    name: 'Coconut Water',
    desc: 'Natural coconut water',
    brands: [
      { id: 'pb_coconut', name: 'PB Swing Coconut', isOwn: true,
        flavors: ['Natural', 'Litchi', 'Guava'] },
      { id: 'real_coconut', name: 'Real Coconut',
        flavors: ['Natural', 'Tender'] },
      { id: 'storia', name: 'Storia',
        flavors: ['Natural', 'With Pulp'] },
      { id: 'b_natural_coconut', name: 'B Natural',
        flavors: ['Tender Coconut'] },
      { id: 'raw_coconut', name: 'Raw Pressery Coconut',
        flavors: ['Pure'] },
      { id: 'cocojal', name: 'Cocojal',
        flavors: ['Natural'] },
    ]
  },
  nata: {
    name: 'Nata de Coco',
    desc: 'Coconut jelly drinks',
    brands: [
      { id: 'pb_nata', name: 'PB Nata', isOwn: true,
        flavors: ['Lychee', 'Strawberry', 'Mango', 'Original', 'Passion Fruit'] },
      { id: 'mogu_mogu', name: 'Mogu Mogu',
        flavors: ['Lychee', 'Strawberry', 'Mango', 'Peach', 'Grape', 'Passion Fruit', 'Melon', 'Coconut'] },
    ]
  },
  zero: {
    name: 'Paper Boat Zero / Sugar-Free',
    desc: 'Zero sugar, zero calorie drinks',
    brands: [
      { id: 'pb_zero', name: 'Paper Boat Zero', isOwn: true,
        flavors: ['Cumin (Jaljeera)', 'Mint Mojito', 'Cranberry', 'Orange', 'Lemon', 'Aam Panna Zero', 'Jamun Zero'] },
      { id: 'schweppes', name: 'Schweppes',
        flavors: ['Tonic Water', 'Ginger Ale', 'Lemon', 'Soda Water', 'Bitter Lemon'] },
      { id: 'jimmys', name: "Jimmy's Cocktails",
        flavors: ['Mojito', 'Cosmopolitan', 'Margarita', 'Lemon Ice Tea', 'Watermelon'] },
      { id: 'raw_pressery_zero', name: 'Raw Pressery Zero',
        flavors: ['Watermelon Mint', 'Orange Ginger', 'Cucumber Lime'] },
      { id: 'tropicana_essentials', name: 'Tropicana Essentials',
        flavors: ['Orange', 'Mixed Fruit', 'Apple'] },
      { id: 'real_activ', name: 'Real Activ',
        flavors: ['Orange', 'Mixed Fruit', 'Mango'] },
    ]
  },
};

const SLOT_TYPES = ['lowest', 'highest', 'bestselling'];
const SLOT_META = {
  lowest:      { label: '↓ Lowest Priced SKU',      cls: 'slot-lowest' },
  highest:     { label: '↑ Highest Priced SKU',     cls: 'slot-highest' },
  bestselling: { label: '★ Best Selling SKU',        cls: 'slot-bestselling' },
};

const emptySKU = () => ({ flavor: '', packSize: '', mrp: '', mop: '', distPrice: '' });

function App() {
  const [step, setStep] = useState(0); // 0=intro, 1=survey, 'submitting', 2=done
  const [retailer, setRetailer] = useState({ name: '', city: '', area: '' });
  const [catData, setCatData] = useState({});      // { brandId: { slots: {lowest,highest,bestselling: sku}, extras: [sku,...] } }
  const [customBrands, setCustomBrands] = useState({}); // { catKey: [{id,name,flavors:[]}] }
  const [addingBrand, setAddingBrand] = useState(null);  // catKey or null
  const [newBrandName, setNewBrandName] = useState('');
  const [expandedBrands, setExpandedBrands] = useState({});
  const [errors, setErrors] = useState({});

  useEffect(() => {
    const init = {};
    Object.values(CATEGORIES).forEach(cat => {
      cat.brands.forEach(b => {
        init[b.id] = { slots: { lowest: emptySKU(), highest: emptySKU(), bestselling: emptySKU() }, extras: [] };
      });
    });
    setCatData(init);
  }, []);

  // ── helpers ──
  const updateSlot = (brandId, slotType, field, val) => {
    setCatData(prev => ({
      ...prev,
      [brandId]: {
        ...prev[brandId],
        slots: { ...prev[brandId].slots, [slotType]: { ...prev[brandId].slots[slotType], [field]: val } }
      }
    }));
  };

  const updateExtra = (brandId, idx, field, val) => {
    setCatData(prev => {
      const extras = [...prev[brandId].extras];
      extras[idx] = { ...extras[idx], [field]: val };
      return { ...prev, [brandId]: { ...prev[brandId], extras } };
    });
  };

  const addExtra = (brandId) => {
    setCatData(prev => ({
      ...prev,
      [brandId]: { ...prev[brandId], extras: [...prev[brandId].extras, emptySKU()] }
    }));
  };

  const addCustomBrand = (catKey) => {
    const name = newBrandName.trim();
    if (!name) return;
    const id = 'custom_' + Date.now();
    const newBrand = { id, name, flavors: [], isCustom: true };
    setCustomBrands(prev => ({ ...prev, [catKey]: [...(prev[catKey] || []), newBrand] }));
    setCatData(prev => ({ ...prev, [id]: { slots: { lowest: emptySKU(), highest: emptySKU(), bestselling: emptySKU() }, extras: [] } }));
    setNewBrandName('');
    setAddingBrand(null);
    setExpandedBrands(prev => ({ ...prev, [id]: true }));
  };

  const hasBrandData = (brandId) => {
    const d = catData[brandId];
    if (!d) return false;
    return Object.values(d.slots).some(s => s.flavor) || d.extras.some(s => s.flavor);
  };

  const validateRetailer = () => {
    if (!retailer.name.trim()) { alert('Please enter your shop/retailer name'); return false; }
    if (!retailer.city.trim()) { alert('Please enter your city'); return false; }
    return true;
  };

  const validateSurvey = () => {
    const newErrors = {};
    let hasAny = false;
    const allBrands = [
      ...Object.values(CATEGORIES).flatMap(c => c.brands),
      ...Object.values(customBrands).flat()
    ];
    allBrands.forEach(brand => {
      const d = catData[brand.id];
      if (!d) return;
      const allSkus = [...Object.values(d.slots), ...d.extras];
      allSkus.forEach((sku, i) => {
        if (!sku.flavor && !sku.mrp) return;
        hasAny = true;
        if (!sku.flavor) newErrors[`${brand.id}-${i}-flavor`] = 'Required';
        if (!sku.mrp)   newErrors[`${brand.id}-${i}-mrp`]   = 'Required';
        if (!sku.mop)   newErrors[`${brand.id}-${i}-mop`]   = 'Required';
        if (sku.mrp && sku.mop && parseFloat(sku.mop) > parseFloat(sku.mrp))
          newErrors[`${brand.id}-${i}-mop`] = 'MOP > MRP?';
      });
    });
    setErrors(newErrors);
    if (!hasAny) { alert('Please enter data for at least one product'); return false; }
    return Object.keys(newErrors).length === 0;
  };

  const handleSubmit = async () => {
    if (!validateSurvey()) return;
    const flat = {
      timestamp: new Date().toISOString(),
      submitted_at: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
      retailer_name: retailer.name,
      retailer_city: retailer.city,
      retailer_area: retailer.area,
    };

    const allBrands = [
      ...Object.values(CATEGORIES).flatMap(c => c.brands),
      ...Object.values(customBrands).flat()
    ];

    allBrands.forEach(brand => {
      const d = catData[brand.id];
      if (!d) return;
      SLOT_TYPES.forEach(slotType => {
        const s = d.slots[slotType];
        if (!s.flavor && !s.mrp) return;
        const p = `${brand.id}_${slotType}`;
        flat[p + '_flavor']    = s.flavor    || '';
        flat[p + '_size']      = s.packSize  || '';
        flat[p + '_mrp']       = s.mrp       || '';
        flat[p + '_mop']       = s.mop       || '';
        flat[p + '_dist']      = s.distPrice || '';
        if (s.mop && s.distPrice)
          flat[p + '_margin'] = ((parseFloat(s.mop) - parseFloat(s.distPrice)) / parseFloat(s.mop) * 100).toFixed(1) + '%';
      });
      d.extras.forEach((s, i) => {
        if (!s.flavor && !s.mrp) return;
        const p = `${brand.id}_extra${i+1}`;
        flat[p + '_flavor']  = s.flavor    || '';
        flat[p + '_size']    = s.packSize  || '';
        flat[p + '_mrp']     = s.mrp       || '';
        flat[p + '_mop']     = s.mop       || '';
        flat[p + '_dist']    = s.distPrice || '';
      });
    });

    setStep('submitting');
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(flat),
      });
      setStep(2);
    } catch(err) {
      try {
        await fetch(SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify(flat)), { mode: 'no-cors' });
        setStep(2);
      } catch(err2) {
        alert('Submit failed. Check internet and try again.\n' + err2.message);
        setStep(1);
      }
    }
  };

  // ── SKU row renderer ──
  const renderSKURow = (brandId, flavors, slotType, sku, onChange, errPrefix) => {
    const meta = SLOT_META[slotType] || { label: `SKU`, cls: 'slot-other' };
    const isCustomBrand = brandId.startsWith('custom_');
    return React.createElement('div', { className: 'sku-slot', key: slotType },
      React.createElement('div', { className: `sku-slot-label ${meta.cls}` }, meta.label),
      React.createElement('div', { className: 'sku-fields-header' },
        React.createElement('span', null, 'Flavor / Variant'),
        React.createElement('span', null, 'Size (ml)'),
        React.createElement('span', null, 'MRP ₹'),
        React.createElement('span', null, 'MOP ₹'),
        React.createElement('span', null, 'Dist ₹'),
      ),
      React.createElement('div', { className: 'sku-fields' },
        // Flavor
        React.createElement('div', { className: 'input-wrapper' },
          isCustomBrand || flavors.length === 0
            ? React.createElement('input', {
                type: 'text', placeholder: 'Flavor / name',
                value: sku.flavor,
                onChange: e => onChange('flavor', e.target.value),
                style: { width: '100%', padding: '7px 5px', fontSize: '12px', border: `1px solid ${errors[errPrefix+'-flavor'] ? '#dc3545' : '#ced4da'}`, borderRadius: '6px' }
              })
            : React.createElement('select', {
                value: sku.flavor,
                onChange: e => onChange('flavor', e.target.value),
                style: { border: `1px solid ${errors[errPrefix+'-flavor'] ? '#dc3545' : '#ced4da'}` }
              },
                React.createElement('option', { value: '' }, '-- Select --'),
                flavors.map(f => React.createElement('option', { key: f, value: f }, f))
              ),
          errors[errPrefix+'-flavor'] && React.createElement('span', { className: 'error-msg' }, errors[errPrefix+'-flavor'])
        ),
        // Pack size
        React.createElement('div', { className: 'input-wrapper' },
          React.createElement('select', { value: sku.packSize, onChange: e => onChange('packSize', e.target.value) },
            React.createElement('option', { value: '' }, '--'),
            PACK_SIZES.map(s => React.createElement('option', { key: s, value: s }, s))
          )
        ),
        // MRP
        React.createElement('div', { className: 'input-wrapper' },
          React.createElement('input', {
            type: 'number', inputMode: 'decimal', placeholder: '0',
            value: sku.mrp, onChange: e => onChange('mrp', e.target.value),
            style: { border: `1px solid ${errors[errPrefix+'-mrp'] ? '#dc3545' : '#ced4da'}` }
          }),
          errors[errPrefix+'-mrp'] && React.createElement('span', { className: 'error-msg' }, errors[errPrefix+'-mrp'])
        ),
        // MOP
        React.createElement('div', { className: 'input-wrapper' },
          React.createElement('input', {
            type: 'number', inputMode: 'decimal', placeholder: '0',
            value: sku.mop, onChange: e => onChange('mop', e.target.value),
            style: { border: `1px solid ${errors[errPrefix+'-mop'] ? '#dc3545' : '#ced4da'}` }
          }),
          errors[errPrefix+'-mop'] && React.createElement('span', { className: 'error-msg' }, errors[errPrefix+'-mop'])
        ),
        // Dist Price
        React.createElement('div', { className: 'input-wrapper' },
          React.createElement('input', {
            type: 'number', inputMode: 'decimal', placeholder: '0',
            value: sku.distPrice, onChange: e => onChange('distPrice', e.target.value)
          })
        ),
      )
    );
  };

  // ── Renders ──
  const renderIntro = () => React.createElement('div', { className: 'content' },
    React.createElement('div', { className: 'instruction' },
      React.createElement('strong', null, '📋 Instructions for Field Team'),
      '1. Fill in retailer details below before starting.',React.createElement('br'),
      '2. Open each brand by tapping the + button.',React.createElement('br'),
      '3. For each brand you stock, fill the LOWEST, HIGHEST & BEST SELLING SKU first.',React.createElement('br'),
      '4. MRP = Price printed on pack   |   MOP = Price you sell to consumer.',React.createElement('br'),
      '5. Dist ₹ = Price retailer pays to distributor (fill if known).',React.createElement('br'),
      '6. Add more SKUs using "+ Add another SKU" if stocking more variants.',React.createElement('br'),
      '7. Skip brands you don\'t stock — leave them collapsed.'
    ),
    React.createElement('div', { style: { marginBottom: '14px' } },
      React.createElement('label', { style: { fontSize: '13px', fontWeight: 600, display: 'block', marginBottom: '6px' } }, 'Shop / Retailer Name *'),
      React.createElement('input', {
        type: 'text', placeholder: 'e.g. Sharma General Store',
        value: retailer.name, onChange: e => setRetailer(p => ({ ...p, name: e.target.value })),
        style: { width: '100%', padding: '10px', fontSize: '14px', border: '1px solid #ced4da', borderRadius: '8px' }
      })
    ),
    React.createElement('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '20px' } },
      React.createElement('div', null,
        React.createElement('label', { style: { fontSize: '13px', fontWeight: 600, display: 'block', marginBottom: '6px' } }, 'City *'),
        React.createElement('input', {
          type: 'text', placeholder: 'e.g. Mumbai',
          value: retailer.city, onChange: e => setRetailer(p => ({ ...p, city: e.target.value })),
          style: { width: '100%', padding: '10px', fontSize: '14px', border: '1px solid #ced4da', borderRadius: '8px' }
        })
      ),
      React.createElement('div', null,
        React.createElement('label', { style: { fontSize: '13px', fontWeight: 600, display: 'block', marginBottom: '6px' } }, 'Area / Locality'),
        React.createElement('input', {
          type: 'text', placeholder: 'e.g. Andheri West',
          value: retailer.area, onChange: e => setRetailer(p => ({ ...p, area: e.target.value })),
          style: { width: '100%', padding: '10px', fontSize: '14px', border: '1px solid #ced4da', borderRadius: '8px' }
        })
      )
    ),
    React.createElement('button', {
      className: 'btn btn-primary', style: { width: '100%' },
      onClick: () => { if (validateRetailer()) setStep(1); }
    }, 'Start Survey →')
  );

  const renderBrand = (brand, catKey) => {
    const d = catData[brand.id];
    if (!d) return null;
    const isExpanded = expandedBrands[brand.id];
    const hasData = hasBrandData(brand.id);
    const flavors = brand.flavors || [];

    return React.createElement('div', { key: brand.id, className: 'brand-section' },
      // Header
      React.createElement('div', { className: 'brand-header', onClick: () => setExpandedBrands(p => ({ ...p, [brand.id]: !p[brand.id] })) },
        React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
          React.createElement('span', { className: 'brand-name' }, brand.name),
          brand.isOwn && React.createElement('span', { className: 'own-badge' }, 'OWN'),
          hasData && React.createElement('span', { className: 'done-badge' }, '✓')
        ),
        React.createElement('span', { className: 'toggle-icon' }, isExpanded ? '−' : '+')
      ),

      // Expanded content
      isExpanded && React.createElement('div', { className: 'sku-slots' },
        // Fixed slots
        SLOT_TYPES.map(slotType =>
          renderSKURow(
            brand.id, flavors, slotType, d.slots[slotType],
            (field, val) => updateSlot(brand.id, slotType, field, val),
            `${brand.id}-slot-${slotType}`
          )
        ),
        // Extra SKUs
        d.extras.map((sku, idx) =>
          renderSKURow(
            brand.id, flavors, `extra_${idx}`, sku,
            (field, val) => updateExtra(brand.id, idx, field, val),
            `${brand.id}-extra-${idx}`
          )
        ),
        // Add more button
        React.createElement('button', { className: 'add-sku-btn', onClick: () => addExtra(brand.id) }, '+ Add another SKU')
      )
    );
  };

  const renderSurvey = () => React.createElement('div', { className: 'content' },
    React.createElement('div', { className: 'instruction' },
      React.createElement('strong', null, '💡 Quick reminder:'),
      'Tap + to open a brand. Fill Lowest, Highest & Best Selling SKU. Dist ₹ = distributor price (optional). Skip brands you don\'t stock.'
    ),
    Object.entries(CATEGORIES).map(([catKey, cat]) => {
      const catCustomBrands = customBrands[catKey] || [];
      return React.createElement('div', { key: catKey, className: 'category-card' },
        React.createElement('div', { className: 'category-name' }, cat.name),
        React.createElement('div', { className: 'category-desc' }, cat.desc),
        cat.brands.map(brand => renderBrand(brand, catKey)),
        catCustomBrands.map(brand => renderBrand(brand, catKey)),
        // Add brand button
        addingBrand === catKey
          ? React.createElement('div', { className: 'custom-brand-input' },
              React.createElement('input', {
                type: 'text', placeholder: 'Brand name...',
                value: newBrandName,
                onChange: e => setNewBrandName(e.target.value),
                onKeyDown: e => { if (e.key === 'Enter') addCustomBrand(catKey); }
              }),
              React.createElement('button', { onClick: () => addCustomBrand(catKey) }, 'Add'),
              React.createElement('button', {
                onClick: () => { setAddingBrand(null); setNewBrandName(''); },
                style: { background: '#6c757d' }
              }, '✕')
            )
          : React.createElement('button', { className: 'add-brand-btn', onClick: () => setAddingBrand(catKey) }, '+ Add a brand not in list')
      );
    }),
    React.createElement('div', { className: 'nav-buttons' },
      React.createElement('button', { className: 'btn btn-secondary', onClick: () => setStep(0) }, 'Back'),
      React.createElement('button', { className: 'btn btn-primary', onClick: handleSubmit }, 'Submit Survey')
    )
  );

  const renderSubmitting = () => React.createElement('div', { className: 'content' },
    React.createElement('div', { className: 'completion-screen' },
      React.createElement('div', { style: { fontSize: '48px', marginBottom: '1rem' } }, '⏳'),
      React.createElement('div', { style: { fontSize: '18px', fontWeight: 500 } }, 'Submitting…'),
      React.createElement('div', { style: { fontSize: '13px', color: '#6c757d', marginTop: '8px' } }, 'Please wait, do not close.')
    )
  );

  const renderDone = () => React.createElement('div', { className: 'content' },
    React.createElement('div', { className: 'completion-screen' },
      React.createElement('div', { style: { fontSize: '48px', marginBottom: '1rem' } }, '✅'),
      React.createElement('div', { style: { fontSize: '20px', fontWeight: 500, marginBottom: '8px' } }, 'Submitted Successfully!'),
      React.createElement('div', { style: { fontSize: '14px', color: '#6c757d', marginBottom: '1.5rem' } }, 'Response saved. You can close this page.'),
      React.createElement('button', { className: 'btn btn-primary', style: { width: '100%' }, onClick: () => window.location.reload() }, 'Submit Another Response')
    )
  );

  const progress = step === 0 ? 10 : step === 1 ? 60 : 100;
  const stepLabel = step === 0 ? 'Retailer Details' : step === 1 ? 'SKU Pricing' : step === 'submitting' ? 'Submitting…' : 'Complete';

  return React.createElement('div', { className: 'container' },
    React.createElement('div', { className: 'progress-bar' },
      React.createElement('div', { className: 'progress-fill', style: { width: `${progress}%` } })
    ),
    React.createElement('div', { className: 'header' },
      React.createElement('h1', null, 'Retail Pricing Survey'),
      React.createElement('p', null, stepLabel)
    ),
    step === 0 && renderIntro(),
    step === 1 && renderSurvey(),
    step === 'submitting' && renderSubmitting(),
    step === 2 && renderDone()
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
